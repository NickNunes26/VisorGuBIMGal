# Own Windows desktop shell (E9): Win32 + WebView2, no Tauri and no MPL-2.0 dependency.
# Standalone Cargo workspace so the Linux/WASM kernel workspace stays untouched.
[workspace]

[package]
name = "visor-gubim-desktop"
version = "0.1.0"
description = "VisorGuBIMGal — aplicación de escritorio para Windows (Win32 + WebView2)"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "VisorGuBIMGal"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

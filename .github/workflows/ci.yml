name: CI

on:
  pull_request:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cargo check
        run: cargo check --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build wasm-api
        run: cargo build -p wasm-api --release --target wasm32-unknown-unknown

  licences:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo deny check
        run: cargo deny check

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Vite build
        run: npx vite build

  ban:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check banned @ifc-lite occurrences
        run: |
          count=$( (grep -rnF "@ifc-lite" package.json package-lock.json src/ --exclude-dir=ifclite 2>/dev/null || true) | wc -l )
          echo "::warning::Found $count occurrences of @ifc-lite outside src/infrastructure/ifclite/"
          # Line to change at T-051 so it fails if occurrences exist: test "$count" -eq 0
          exit 0
